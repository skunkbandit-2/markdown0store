name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools from mise.toml
        uses: jdx/mise-action@v2

      - name: Run project checks
        run: mise run pre-commit
